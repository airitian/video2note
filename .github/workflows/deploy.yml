name: Deploy to ModelScope Studio

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:  # 允许手动触发

env:
  STUDIO_OWNER: "viva25"
  STUDIO_NAME: "video_txt"
  MODELSCOPE_HOST: "modelscope.cn"

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      # ========== 步骤 1：检出代码 ==========
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 获取所有提交历史
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # ========== 步骤 2：配置 Git ==========
      - name: Configure Git
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"
          git config --global init.defaultBranch master
          git config --global pull.rebase false
      
      # ========== 步骤 3：添加 ModelScope 远程仓库 ==========
      - name: Add ModelScope remote
        run: |
          # 如果 modelscope 远程已存在，先移除它（确保使用最新的 API Key）
          git remote remove modelscope 2>/dev/null || true
          
          # 添加新的远程仓库
          git remote add modelscope https://oauth2:${{ secrets.MODELSCOPE_API_KEY }}@${{ env.MODELSCOPE_HOST }}/studios/${{ env.STUDIO_OWNER }}/${{ env.STUDIO_NAME }}.git
          
          echo "✅ Remote added successfully"
          git remote -v
      
      # ========== 步骤 4：拉取并合并远程更改（关键步骤）==========
      - name: Fetch and merge remote changes
        run: |
          echo "📥 Fetching from ModelScope..."
          
          # 尝试拉取远程的所有分支
          if ! git fetch modelscope --all 2>&1; then
            echo "⚠️ Initial fetch failed, trying simpler approach..."
            git fetch modelscope || {
              echo "❌ Cannot fetch from remote. Creating fresh branch."
              # 如果远程是空的或不可访问，直接使用当前代码
              git checkout master || git checkout -b master
              exit 0
            }
          fi
          
          # 确保在 master 分支
          echo "🌿 Switching to master branch..."
          if git show-ref --verify --quiet refs/heads/master; then
            git checkout master
          else
            git checkout -b master
          fi
          
          # 检查远程是否有 master 分支
          if git rev-parse --verify modelscope/master >/dev/null 2>&1; then
            echo "🔄 Merging remote changes..."
            
            # 尝试合并远程更改，处理不相关的历史
            if ! git merge modelscope/master --allow-unrelated-histories --no-edit 2>&1; then
              echo "⚠️ Merge had conflicts, resolving by keeping local versions..."
              
              # 保留本地版本解决冲突
              git add .
              git commit -m "Resolve merge conflicts - keep local version" || true
            fi
          else
            echo "ℹ️ Remote has no master branch yet, proceeding with current code"
          fi
      
      # ========== 步骤 5：添加并提交更改 ==========
      - name: Stage and commit changes
        run: |
          # 显示当前状态
          echo "📊 Current Git status:"
          git status --short || true
          
          # 添加所有文件（包括删除的文件）
          echo "💾 Adding all changes..."
          git add -A .
          
          # 创建提交（即使没有变化也允许空提交）
          git commit -m "Auto-deploy: Sync from GitHub at $(date '+%Y-%m-%d %H:%M:%S %Z')" \
            --allow-empty || echo "ℹ️ No new changes to commit"
          
          # 显示提交信息
          git log -1 --oneline
      
      # ========== 步骤 6：推送到 ModelScope ==========
      - name: Push to ModelScope
        run: |
          echo "📤 Pushing to ModelScope Studio..."
          
          # 首先尝试普通推送（fast-forward）
          if git push modelscope HEAD:master 2>&1; then
            echo "✅ Push successful!"
            exit 0
          fi
          
          # 如果失败，尝试 rebase 后再推送
          echo "⚠️ Normal push failed, trying rebase..."
          if git pull modelscope master --rebase --allow-unrelated-histories 2>&1; then
            git push modelscope master && exit 0
          fi
          
          # 最后手段：强制推送（仅在完全必要时使用）
          echo "⚠️ Using force push as last resort..."
          git push modelscope HEAD:master -f || {
            echo "❌ All push attempts failed!"
            exit 1
          }
          
          echo "✅ Force push completed!"
      
      # ========== 步骤 7：触发部署 ==========
      - name: Trigger Deployment
        run: |
          echo "🔨 Triggering deployment on ModelScope..."
          
          DEPLOY_RESPONSE=$(
            curl -s -X POST \
              "https://${{ env.MODELSCOPE_HOST }}/openapi/v1/studios/${{ env.STUDIO_OWNER }}/${{ env.STUDIO_NAME }}/deploy" \
              -H "Authorization: Bearer ${{ secrets.MODELSCOPE_API_KEY }}" \
              -H "Content-Type: application/json"
          )
          
          echo "$DEPLOY_RESPONSE" | tee deploy-response.json
          
          # 检查是否成功
          SUCCESS=$(echo "$DEPLOY_RESPONSE" | python3 -c "import sys,json; print('true' if json.load(sys.stdin).get('success') else 'false')")
          
          if [ "$SUCCESS" = "true" ]; then
            echo "✅ Deployment triggered successfully!"
          else
            echo "⚠️ Deployment trigger failed or returned unexpected response"
            # 即使这一步失败也不要阻止工作流，因为代码已经推送了
          }
      
      # ========== 步骤 8：等待并检查部署状态 ==========
      - name: Wait and check deployment status
        run: |
          echo "⏳ Waiting 30 seconds for deployment to initialize..."
          sleep 30
          
          echo "📊 Checking deployment logs..."
          
          LOGS_RESPONSE=$(
            curl -s \
              "https://${{ env.MODELSCOPE_HOST }}/openapi/v1/studios/${{ env.STUDIO_OWNER }}/${{ env.STUDIO_NAME }}/logs/run" \
              -H "Authorization: Bearer ${{ secrets.MODELSCOPE_API_KEY }}"
          )
          
          echo "$LOGS_RESPONSE" > logs.json
          
          # 提取最后 10 条日志
          echo "Last 10 log entries:"
          echo "======================"
          echo "$LOGS_RESPONSE" | python3 -c "
            import sys, json
            data = json.load(sys.stdin)
            logs = data.get('data', [])
            for log in logs[-10:]:
              print(log)
          " 2>/dev/null || echo "No logs available yet"
          
          # 检查部署状态
          STATUS_RESPONSE=$(
            curl -s \
              "https://${{ env.MODELSCOPE_HOST }}/openapi/v1/studios/${{ env.STUDIO_OWNER }}/${{ env.STUDIO_NAME }}" \
              -H "Authorization: Bearer ${{ secrets.MODELSCOPE_API_KEY }}"
          )
          
          STATUS=$(echo "$STATUS_RESPONSE" | python3 -c "import sys,json; print(json.load(sys.stdin).get('data', {}).get('status', 'UNKNOWN'))" 2>/dev/null || echo "UNKNOWN")
          
          echo ""
          echo "Current deployment status: $STATUS"
      
      # ========== 步骤 9：输出成功信息 ==========
      - name: Success Notification
        if: success()
        run: |
          echo ""
          echo "=========================================="
          echo "🎉 部署已成功触发！"
          echo "=========================================="
          echo ""
          echo "📱 访问地址："
          echo "   https://${{ env.MODELSCOPE_HOST }}/studios/${{ env.STUDIO_OWNER }}/${{ env.STUDIO_NAME }}"
          echo ""
          echo "⏱️ 预计完成时间：2-5 分钟"
          echo "👀 查看实时状态："
          echo "   https://${{ env.MODELSCOPE_HOST }}/studios/${{ env.STUDIO_OWNER }}/${{ env.STUDIO_NAME }}/files"
          echo ""
          echo "=========================================="
      
      # ========== 步骤 10：失败通知 ==========
      - name: Failure Notification
        if: failure()
        run: |
          echo ""
          echo "=========================================="
          echo "❌ 部署过程中出现错误"
          echo "=========================================="
          echo ""
          echo "请检查："
          echo "1. MODELSCOPE_API_KEY 是否正确"
          echo "2. 创空间 viva25/video_txt 是否存在"
          echo "3. GitHub 和 ModelScope 的 Git 历史记录冲突"
          echo ""
          echo "可以手动访问创空间查看状态："
          echo "https://${{ env.MODELSCOPE_HOST }}/studios/${{ env.STUDIO_OWNER }}/${{ env.STUDIO_NAME }}"
          echo ""
          echo "=========================================="
